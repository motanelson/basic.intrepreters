<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Label-BASIC IDE</title>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #fafafa;
      --border: #e4e4e7;
      --border-focus: #71717a;
      --text-main: #09090b;
      --text-muted: #71717a;
      --accent: #18181b;
      --accent-hover: #27272a;
      --code-bg: #ffffff;
      --console-bg: #fcfcfc;
      --selection: #e4e4e7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg);
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .brand h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .brand span {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    select, button {
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-main);
      cursor: pointer;
      outline: none;
      transition: all 0.15s ease;
    }

    select:hover, button:hover {
      background: var(--surface);
      border-color: #d4d4d8;
    }

    button.primary {
      background: var(--accent);
      color: #ffffff;
      border: 1px solid var(--accent);
    }

    button.primary:hover {
      background: var(--accent-hover);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 0;
    }

    .pane {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
    }

    .pane-header {
      padding: 10px 20px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .editor-pane {
      border-right: 1px solid var(--border);
    }

    .editor-container {
      position: relative;
      flex: 1;
      display: flex;
      background: var(--code-bg);
      overflow: hidden;
    }

    .line-numbers {
      width: 44px;
      padding: 16px 0;
      text-align: right;
      font-family: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      line-height: 20px;
      color: #a1a1aa;
      user-select: none;
      border-right: 1px solid #f4f4f5;
      background: #fafafa;
    }

    .line-numbers div {
      padding-right: 12px;
    }

    textarea#editor {
      flex: 1;
      padding: 16px;
      font-family: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      line-height: 20px;
      border: none;
      resize: none;
      outline: none;
      white-space: pre;
      color: var(--text-main);
      background: transparent;
      tab-size: 4;
    }

    .console-pane {
      background: var(--console-bg);
    }

    #console {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      font-family: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      line-height: 20px;
    }

    .log-line {
      white-space: pre-wrap;
      word-break: break-all;
    }

    .log-error {
      color: #dc2626;
      font-weight: 500;
    }

    .log-system {
      color: #71717a;
      font-style: italic;
    }

    .input-row {
      display: flex;
      align-items: center;
      margin-top: 4px;
    }

    .input-prompt {
      color: #09090b;
      font-weight: 600;
      margin-right: 6px;
    }

    #terminal-input {
      flex: 1;
      border: none;
      outline: none;
      font-family: inherit;
      font-size: inherit;
      background: transparent;
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>Label-BASIC</h1>
      <span>No-Line-Number IDE</span>
    </div>
    <div class="toolbar">
      <select id="example-select">
        <option value="">Load Example...</option>
        <option value="guess">Number Guessing Game</option>
        <option value="fibonacci">Fibonacci Series</option>
        <option value="subroutines">Subroutines (GOSUB/RETURN)</option>
      </select>
      <button id="btn-run" class="primary">Run</button>
      <button id="btn-stop" disabled>Stop</button>
      <button id="btn-clear">Clear</button>
    </div>
  </header>

  <main>
    <section class="pane editor-pane">
      <div class="pane-header">Source Code</div>
      <div class="editor-container">
        <div class="line-numbers" id="line-numbers"></div>
        <textarea id="editor" spellcheck="false"></textarea>
      </div>
    </section>

    <section class="pane console-pane">
      <div class="pane-header">
        <span>Output</span>
        <span id="status-indicator" style="font-weight:normal; text-transform:none;">Ready</span>
      </div>
      <div id="console"></div>
    </section>
  </main>

  <script>
    // --- SAMPLE PROGRAMS ---
    const EXAMPLES = {
      guess: 
`REM --- Number Guessing Game ---
PRINT "Welcome to Guess The Number!"
LET target = INT(RND(100)) + 1
LET tries = 0

ask_guess:
  INPUT "Enter guess (1-100): ", guess
  LET tries = tries + 1

  IF guess = target THEN GOTO won
  IF guess < target THEN PRINT "Higher!"
  IF guess > target THEN PRINT "Lower!"
  GOTO ask_guess

won:
  PRINT "Congratulations! You found it in " + tries + " tries."
  END`,

      fibonacci:
`REM --- Fibonacci Generator ---
INPUT "How many terms? ", n
LET a = 0
LET b = 1
LET i = 0

PRINT "Fibonacci sequence:"

loop:
  IF i >= n THEN GOTO finished
  PRINT a
  LET temp = a + b
  LET a = b
  LET b = temp
  LET i = i + 1
  GOTO loop

finished:
  PRINT "Done!"
  END`,

      subroutines:
`REM --- GOSUB / RETURN Demonstration ---
LET name = "Explorer"
GOSUB greet_user

LET score = 100
GOSUB print_score
END

greet_user:
  PRINT "Hello, " + name + "!"
  RETURN

print_score:
  PRINT "Current Score: " + score
  RETURN`
    };

    // --- INTERPRETER ENGINE ---
    class BasicInterpreter {
      constructor(code, printFn, inputFn, onFinish) {
        this.code = code;
        this.print = printFn;
        this.input = inputFn;
        this.onFinish = onFinish;
        
        this.lines = [];
        this.labels = {};
        this.variables = {};
        this.callStack = [];
        this.pc = 0;
        this.running = false;
        this.steps = 0;
      }

      prepare() {
        const rawLines = this.code.split('\n');
        this.lines = [];
        this.labels = {};

        for (let i = 0; i < rawLines.length; i++) {
          let line = rawLines[i].trim();
          
          // Remove comments starting with REM or '
          if (line.toUpperCase().startsWith("REM ") || line === "REM" || line.startsWith("'")) {
            line = "";
          }

          // Check if line defines a label (e.g. `label:` or `label: STATEMENT`)
          const labelMatch = line.match(/^([a-zA-Z_][a-zA-Z0-9_]*):(.*)$/);
          if (labelMatch) {
            const labelName = labelMatch[1].toLowerCase();
            this.labels[labelName] = this.lines.length;
            line = labelMatch[2].trim();
          }

          this.lines.push(line);
        }
      }

      async start() {
        this.prepare();
        this.running = true;
        this.pc = 0;
        this.callStack = [];
        this.variables = {};

        try {
          while (this.running && this.pc < this.lines.length) {
            const line = this.lines[this.pc];
            this.pc++;

            if (!line) continue;

            await this.executeLine(line);

            // Yield control occasionally to prevent freezing the UI
            this.steps++;
            if (this.steps % 50 === 0) {
              await new Promise(r => setTimeout(r, 0));
            }
          }
        } catch (err) {
          this.print(err.message, "log-error");
        } finally {
          this.running = false;
          this.onFinish();
        }
      }

      stop() {
        this.running = false;
      }

      async executeLine(line) {
        // MATCH: IF <cond> THEN GOTO <label> | IF <cond> THEN <statement> | IF <cond> GOTO <label>
        const ifMatch = line.match(/^IF\s+(.*?)\s+(?:THEN\s+GOTO|THEN|GOTO)\s+(.*)$/i);
        if (ifMatch) {
          const condExpr = ifMatch[1];
          const thenClause = ifMatch[2].trim();

          const condValue = this.evalExpr(condExpr);
          if (this.isTruthy(condValue)) {
            // If the then-clause matches a label directly, jump to it
            const target = thenClause.toLowerCase();
            if (this.labels.hasOwnProperty(target)) {
              this.pc = this.labels[target];
            } else {
              await this.executeLine(thenClause);
            }
          }
          return;
        }

        // MATCH: GOTO <label>
        const gotoMatch = line.match(/^GOTO\s+([a-zA-Z_][a-zA-Z0-9_]*)$/i);
        if (gotoMatch) {
          const target = gotoMatch[1].toLowerCase();
          if (this.labels.hasOwnProperty(target)) {
            this.pc = this.labels[target];
          } else {
            throw new Error(`Undefined label: ${gotoMatch[1]}`);
          }
          return;
        }

        // MATCH: GOSUB <label>
        const gosubMatch = line.match(/^GOSUB\s+([a-zA-Z_][a-zA-Z0-9_]*)$/i);
        if (gosubMatch) {
          const target = gosubMatch[1].toLowerCase();
          if (this.labels.hasOwnProperty(target)) {
            this.callStack.push(this.pc);
            this.pc = this.labels[target];
          } else {
            throw new Error(`Undefined label: ${gosubMatch[1]}`);
          }
          return;
        }

        // MATCH: RETURN
        if (line.match(/^RETURN$/i)) {
          if (this.callStack.length === 0) {
            throw new Error("RETURN without GOSUB");
          }
          this.pc = this.callStack.pop();
          return;
        }

        // MATCH: PRINT expr [,;]
        if (line.match(/^PRINT(\s+.*)?$/i)) {
          const rest = line.substring(5).trim();
          if (!rest) {
            this.print("");
          } else {
            const val = this.evalExpr(rest);
            this.print(val);
          }
          return;
        }

        // MATCH: INPUT ["prompt",] var
        const inputMatch = line.match(/^INPUT\s+(?:("[^"]*")\s*,\s*)?([a-zA-Z_][a-zA-Z0-9_]*)$/i);
        if (inputMatch) {
          let prompt = "? ";
          if (inputMatch[1]) {
            prompt = inputMatch[1].slice(1, -1);
          }
          const varName = inputMatch[2].toLowerCase();
          const userVal = await this.input(prompt);
          // Auto-parse numeric input if valid number
          const numVal = Number(userVal);
          this.variables[varName] = (!isNaN(numVal) && userVal.trim() !== "") ? numVal : userVal;
          return;
        }

        // MATCH: LET var = expr OR var = expr
        const assignMatch = line.match(/^(?:LET\s+)?([a-zA-Z_][a-zA-Z0-9_]*)\s*=\s*(.*)$/i);
        if (assignMatch) {
          const varName = assignMatch[1].toLowerCase();
          const val = this.evalExpr(assignMatch[2]);
          this.variables[varName] = val;
          return;
        }

        // MATCH: SLEEP ms
        const sleepMatch = line.match(/^SLEEP\s+(.*)$/i);
        if (sleepMatch) {
          const ms = this.evalExpr(sleepMatch[1]);
          await new Promise(r => setTimeout(r, ms));
          return;
        }

        // MATCH: END
        if (line.match(/^END$/i)) {
          this.running = false;
          return;
        }

        throw new Error(`Syntax error or unknown command: ${line}`);
      }

      isTruthy(val) {
        if (typeof val === "boolean") return val;
        if (typeof val === "number") return val !== 0;
        return Boolean(val);
      }

      evalExpr(exprStr) {
        let jsExpr = exprStr
          .replace(/<>/g, "!=")
          .replace(/(?<=[^=<>!])=(?=[^=])/g, "==")
          .replace(/\bAND\b/gi, "&&")
          .replace(/\bOR\b/gi, "||")
          .replace(/\bNOT\b/gi, "!")
          .replace(/\bINT\(/gi, "Math.floor(")
          .replace(/\bRND\((.*?)\)/gi, "Math.floor(Math.random() * ($1))");

        // Resolve variables
        const scope = { ...this.variables };
        const argNames = Object.keys(scope);
        const argVals = Object.values(scope);

        // Sanitize identifiers: replace lowercase versions of var names
        jsExpr = jsExpr.replace(/[a-zA-Z_][a-zA-Z0-9_]*/g, (id) => {
          const lower = id.toLowerCase();
          if (["Math", "true", "false"].includes(id)) return id;
          if (scope.hasOwnProperty(lower)) return lower;
          return id;
        });

        try {
          const fn = new Function(...argNames, `"use strict"; return (${jsExpr});`);
          return fn(...argVals);
        } catch (e) {
          throw new Error(`Expression error in [${exprStr}]: ${e.message}`);
        }
      }
    }

    // --- UI CONTROLLER ---
    const editor = document.getElementById("editor");
    const lineNumbers = document.getElementById("line-numbers");
    const consoleDiv = document.getElementById("console");
    const btnRun = document.getElementById("btn-run");
    const btnStop = document.getElementById("btn-stop");
    const btnClear = document.getElementById("btn-clear");
    const selectExample = document.getElementById("example-select");
    const statusIndicator = document.getElementById("status-indicator");

    let currentInterpreter = null;

    function updateLineNumbers() {
      const lines = editor.value.split('\n').length;
      let html = '';
      for (let i = 1; i <= lines; i++) {
        html += `<div>${i}</div>`;
      }
      lineNumbers.innerHTML = html;
    }

    editor.addEventListener('input', updateLineNumbers);
    editor.addEventListener('scroll', () => {
      lineNumbers.scrollTop = editor.scrollTop;
    });

    // Handle indentation with Tab key
    editor.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        editor.value = editor.value.substring(0, start) + "  " + editor.value.substring(end);
        editor.selectionStart = editor.selectionEnd = start + 2;
        updateLineNumbers();
      }
    });

    function logOutput(text, className = "") {
      const line = document.createElement("div");
      line.className = "log-line " + className;
      line.textContent = text;
      consoleDiv.appendChild(line);
      consoleDiv.scrollTop = consoleDiv.scrollHeight;
    }

    function requestInput(promptText) {
      return new Promise((resolve) => {
        const row = document.createElement("div");
        row.className = "input-row";

        const label = document.createElement("span");
        label.className = "input-prompt";
        label.textContent = promptText;

        const input = document.createElement("input");
        input.id = "terminal-input";
        input.type = "text";
        input.autocomplete = "off";

        row.appendChild(label);
        row.appendChild(input);
        consoleDiv.appendChild(row);
        consoleDiv.scrollTop = consoleDiv.scrollHeight;

        input.focus();

        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            const val = input.value;
            input.disabled = true;
            row.replaceWith(Object.assign(document.createElement("div"), {
              className: "log-line",
              textContent: promptText + val
            }));
            resolve(val);
          }
        });
      });
    }

    btnRun.addEventListener("click", () => {
      if (currentInterpreter && currentInterpreter.running) return;

      btnRun.disabled = true;
      btnStop.disabled = false;
      statusIndicator.textContent = "Running...";

      currentInterpreter = new BasicInterpreter(
        editor.value,
        logOutput,
        requestInput,
        () => {
          btnRun.disabled = false;
          btnStop.disabled = true;
          statusIndicator.textContent = "Finished";
        }
      );

      currentInterpreter.start();
    });

    btnStop.addEventListener("click", () => {
      if (currentInterpreter) {
        currentInterpreter.stop();
        logOutput("[Execution Interrupted]", "log-system");
        btnRun.disabled = false;
        btnStop.disabled = true;
        statusIndicator.textContent = "Stopped";
      }
    });

    btnClear.addEventListener("click", () => {
      consoleDiv.innerHTML = "";
    });

    selectExample.addEventListener("change", (e) => {
      const val = e.target.value;
      if (EXAMPLES[val]) {
        editor.value = EXAMPLES[val];
        updateLineNumbers();
      }
    });

    // Default template load
    editor.value = EXAMPLES.guess;
    updateLineNumbers();
  </script>
</body>
</html>
